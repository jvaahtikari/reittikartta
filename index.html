      var ls = dots.getLayers(); if (ls.length) dots.removeLayer(ls[ls.length - 1]);
      lastLeg();
    }
    function upd(ll) {
      var last = measure.pts[measure.pts.length - 1];
      if (!last) return;
      rubber.setLatLngs([[last.lat, last.lng], [ll.lat, ll.lng]]);
      var d = G.distance(last, ll);
      UI.readout({ brg: G.bearing(last, ll), dist: d, total: total() + d });
    }
    App.setMode('measure', {
      label: 'Harppi', cursor: true, button: 'tbMeasure',
      click: function (e) { add(e.latlng); if (UI.isTouch()) lastLeg(); else upd(e.latlng); },
      move: function (e) { upd(e.latlng); },
      key: function (e) {
        if ((e.key === 'Delete' || e.key === 'Backspace') && measure.pts.length) {
          e.preventDefault();
          removeLast();
          return true;
        }
        return false;
      },
      menu: function (e) {
        UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
          { label: 'Lopeta mittaus', key: 'Esc', action: function () { App.clearMode(); } },
          { label: 'Muuta reitiksi', disabled: measure.pts.length < 2, action: function () {
            var pts = measure.pts.slice(); App.clearMode();
            var r = S.newRoute(pts); S.emit('routes'); global.Routes.enterEdit(r.id);
          } }
        ], 'Harppi');
      },
      cancel: function () {
        tempLayer.clearLayers(); measure = null; UI.clearMeasure();
        if (UI.isTouch()) { UI.banner(null); if (global.Routes.editingId) global.Routes.updateBanner(); }
      }
    });
    if (UI.isTouch()) UI.banner({
      kind: 'adding', text: 'Harppi – napauta pisteet kartalle.',
      buttons: [
        { label: 'Poista viimeinen', action: function () { removeLast(); } },
        { label: 'Muuta reitiksi', action: function () {
          if (measure.pts.length < 2) { UI.toast('Reittiin tarvitaan vähintään kaksi pistettä.'); return; }
          var pts = measure.pts.slice(); App.clearMode();
          var r = S.newRoute(pts); S.emit('routes'); global.Routes.enterEdit(r.id);
        } },
        { label: 'Valmis', action: function () { App.clearMode(); } }
      ]
    });
    if (first) add(first);
  }

  // ---------- suuntima ----------
  function startEbl(origin) {
    var st = S.state.settings.station;
    var o = origin || (st ? { lat: st.lat, lng: st.lng } : null);
    var line = L.polyline([], { color: '#0b4f7a', weight: 1.6, dashArray: '7 5', interactive: false }).addTo(tempLayer);
    var ring = L.circle([0, 0], { radius: 1, color: '#0b4f7a', weight: 1, dashArray: '3 6', fill: false, interactive: false });
    var dot = null;
    function setO(ll) {
      o = { lat: ll.lat, lng: ll.lng };
      if (dot) tempLayer.removeLayer(dot);
      dot = L.circleMarker(ll, { radius: 4, color: '#0b4f7a', weight: 2, fillColor: '#fff', fillOpacity: 1, interactive: false }).addTo(tempLayer);
    }
    if (o) setO(o);
    App.setMode('ebl', {
      label: o ? 'Suuntima' : 'Suuntima – klikkaa alkupiste', cursor: true, button: 'tbEbl',
      click: function (e) { setO(e.latlng); App.setLabel('Suuntima'); },
      move: function (e) {
        if (!o) return;
        line.setLatLngs([[o.lat, o.lng], [e.latlng.lat, e.latlng.lng]]);
        var d = G.distance(o, e.latlng);
        ring.setLatLng([o.lat, o.lng]).setRadius(d);
        if (!tempLayer.hasLayer(ring)) ring.addTo(tempLayer);
        UI.readout({ brg: G.bearing(o, e.latlng), dist: d, total: null });
      },
      menu: function (e) {
        UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
          { label: 'Aseta alkupiste tähän', action: function () { setO(e.latlng); } },
          { label: 'Lopeta suuntima', key: 'Esc', action: function () { App.clearMode(); } }
        ], 'Suuntima');
      },
      cancel: function () { tempLayer.clearLayers(); UI.clearMeasure(); }
    });
  }

  // ---------- poiminta kartalta ----------
  function pick(label, cb) {
    App.setMode('pick', {
      label: label, cursor: true,
      click: function (e) { App.clearMode(); cb(e.latlng); },
      cancel: function () { }
    });
  }

  // ---------- omat merkit ----------
  function renderMarks() {
    markLayer.clearLayers();
    S.state.marks.forEach(function (m) {
      var sym = markSym(m.type);
      var html = sym.html + (m.name ? '<span class="mk-name">' + UI.esc(m.name) + '</span>' : '');
      var mk = L.marker([m.lat, m.lng], {
        icon: L.divIcon({ className: 'mk' + (m.status === 'approved' ? '' : ' draft'), html: html, iconSize: [sym.w, sym.h], iconAnchor: [sym.ax, sym.ay] }),
        draggable: !!m._moving, keyboard: false, bubblingMouseEvents: false
      });
      mk.bindTooltip(UI.esc(typeName(m.type)) + (m.status === 'approved' ? '' : ' (luonnos)') + '<br>' + G.fmtPos(m), { direction: 'top', offset: [0, -10] });
      mk.on('contextmenu', function (e) { L.DomEvent.stop(e); markMenu(m, e); });
      mk.on('dblclick', function (e) { L.DomEvent.stop(e); editMark(m.id); });
      mk.on('dragend', function (e) {
        var q = e.target.getLatLng(); m.lat = q.lat; m.lng = q.lng; delete m._moving; S.emit('marks');
      });
      mk.addTo(markLayer);
    });
  }

  function markMenu(m, e) {
    UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
      { label: 'Ominaisuudet…', action: function () { editMark(m.id); } },
      { label: 'Siirrä merkkiä', action: function () { m._moving = true; renderMarks(); UI.toast('Vedä merkki uuteen paikkaan.'); } },
      { label: 'Suuntima tästä', action: function () { startEbl({ lat: m.lat, lng: m.lng }); } },
      { sep: true },
      { label: 'Poista merkki…', action: function () {
        UI.confirm('Poistetaanko merkki "' + (m.name || typeName(m.type)) + '"?', 'Poista', function () {
          S.state.marks = S.state.marks.filter(function (x) { return x.id !== m.id; }); S.emit('marks');
        }, true);
      } }
    ], m.name || typeName(m.type));
  }

  function markForm(m) {
    return '<div class="form">' +
      '<label for="mName">Nimi</label><input id="mName" value="' + UI.esc(m.name || '') + '" placeholder="esim. Uusi punainen lateraali">' +
      '<label for="mType">Tyyppi</label><select id="mType">' + MARK_TYPES.map(function (t) {
        return '<option value="' + t[0] + '"' + (t[0] === m.type ? ' selected' : '') + '>' + t[1] + '</option>';
      }).join('') + '</select>' +
      '<label for="mPos">Koordinaatit</label><input id="mPos" value="' + UI.esc(G.fmtPos(m)) + '">' +
      '<div class="hint">Esim. 61°31,234\'N 023°45,678\'E tai 61.5206 23.7613</div>' +
      '<label for="mDesc">Selite</label><textarea id="mDesc">' + UI.esc(m.desc || '') + '</textarea>' +
      '<div class="err" id="mErr" hidden></div></div>';
  }

  function editMark(id, newPos) {
    var isNew = !id;
    var m = isNew ? { id: S.uid('mk'), name: '', type: 'general', lat: newPos.lat, lng: newPos.lng, desc: '', status: 'draft' } : S.markById(id);
    if (!m) return;
    function save(md, status) {
      var pos = G.parsePos(md.querySelector('#mPos').value);
      if (!pos) { var er = md.querySelector('#mErr'); er.textContent = 'Koordinaatteja ei tunnistettu. Tarkista muoto.'; er.hidden = false; return false; }
      m.name = md.querySelector('#mName').value.trim();
      m.type = md.querySelector('#mType').value;
      m.desc = md.querySelector('#mDesc').value;
      m.lat = pos.lat; m.lng = pos.lng;
      if (status) m.status = status;
      if (isNew) S.state.marks.push(m);
      S.emit('marks');
    }
    var buttons = [{ label: 'Peruuta' }, { label: 'Tallenna luonnoksena', action: function (md) { return save(md, m.status === 'approved' ? 'approved' : 'draft'); } }];
    if (m.status !== 'approved') buttons.push({ label: 'Hyväksy kirjastoon', approve: true, action: function (md) { return save(md, 'approved'); } });
    else buttons[1].label = 'Tallenna';
    UI.modal({ title: isNew ? 'Uusi merkki' : 'Merkin ominaisuudet', body: markForm(m), buttons: buttons, enterButton: 1 });
  }

  // ---------- tehtäväpaikat ----------
  function renderTasks() {
    taskLayer.clearLayers();
    S.state.tasks.forEach(function (t) {
      var html = taskSvg(t.active) + '<span class="task-name">' + UI.esc(t.name || 'Tehtävä') + '</span>';
      var mk = L.marker([t.lat, t.lng], {
        icon: L.divIcon({ className: 'mk', html: html, iconSize: [30, 30], iconAnchor: [15, 15] }),
        draggable: true, keyboard: false, bubblingMouseEvents: false, zIndexOffset: 700
      });
      mk.bindTooltip(G.fmtPos(t) + (t.time ? '<br>' + UI.esc(fmtTime(t.time)) : ''), { direction: 'top', offset: [0, -14] });
      mk.on('contextmenu', function (e) { L.DomEvent.stop(e); taskMenu(t, e); });
      mk.on('dblclick', function (e) { L.DomEvent.stop(e); editTask(t.id); });
      mk.on('dragend', function (e) { var q = e.target.getLatLng(); t.lat = q.lat; t.lng = q.lng; S.emit('tasks'); });
      mk.addTo(taskLayer);
    });
    updateTaskReadout();
  }

  function fmtTime(s) {
    var d = new Date(s);
    return isNaN(d) ? s : d.toLocaleString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function taskMenu(t, e) {
    UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
      { label: 'Ominaisuudet…', action: function () { editTask(t.id); } },
      { label: t.active ? 'Poista aktiivisuus' : 'Aseta aktiiviseksi', action: function () { setActiveTask(t.active ? null : t.id); } },
      { label: 'Suuntima tehtävään asemalta', disabled: !S.state.settings.station, action: function () {
        var st = S.state.settings.station;
        startEbl({ lat: st.lat, lng: st.lng });
      } },
      { label: 'Uusi reitti asemalta tehtävään', disabled: !S.state.settings.station, action: function () {
        var st = S.state.settings.station;
        var r = S.newRoute([{ lat: st.lat, lng: st.lng }, { lat: t.lat, lng: t.lng }]);
        r.from = st.name || 'Asema'; r.to = t.name || 'Tehtävä'; r.name = S.autoName(r);
        S.emit('routes'); global.Routes.enterEdit(r.id);
        UI.toast('Suora reittiluonnos luotu. Lisää reittipisteitä oikealla napilla reittiviivasta.');
      } },
      { label: 'Reititä tehtävälle väylää pitkin…', action: function () { global.Routing.taskDialog(t.id); } },
      { sep: true },
      { label: 'Poista tehtävä…', action: function () {
        UI.confirm('Poistetaanko tehtävä "' + (t.name || 'Tehtävä') + '"?', 'Poista', function () {
          S.state.tasks = S.state.tasks.filter(function (x) { return x.id !== t.id; }); S.emit('tasks');
        }, true);
      } }
    ], t.name || 'Tehtävä');
  }

  function setActiveTask(id) {
    S.state.tasks.forEach(function (t) { t.active = t.id === id; });
    S.emit('tasks');
  }

  function localDT(d) {
    var p = G.pad;
    return d.getFullYear() + '-' + p(d.getMonth() + 1, 2) + '-' + p(d.getDate(), 2) + 'T' + p(d.getHours(), 2) + ':' + p(d.getMinutes(), 2);
  }

  // Tehtäväpaikan voi antaa koordinaatteina, poimia kartalta tai hakea nimellä. Haun tulos tarkistetaan
  // kartalla ennen vahvistusta: numeroidut osumat näkyvät, ja merkkiä voi siirtää tai napauttaa karttaa.
  // draft on lomakkeen keskeneräinen tila (uusi tehtävä tai muokattavan kopio); ctx säilyttää haun.
  // after(task): kutsutaan, kun tehtävä on luotu tai tallennettu (task) tai lomake peruttiin (null).
  function editTask(id, newPos, draft, ctx, after) {
    var isNew = !id;
    var orig = isNew ? null : S.taskById(id);
    if (!isNew && !orig) return;
    var nowD = new Date();
    var t = draft || (isNew
      ? { id: S.uid('tk'), name: 'Tehtävä ' + G.pad(nowD.getHours(), 2) + ':' + G.pad(nowD.getMinutes(), 2), lat: newPos ? newPos.lat : null, lng: newPos ? newPos.lng : null, time: localDT(nowD), active: true }
      : L.extend({}, orig));
    ctx = ctx || { q: '', results: [], ref: null, place: null };
    var body = '<div class="form">' +
      '<label for="tName">Nimi</label><input id="tName" value="' + UI.esc(t.name || '') + '" placeholder="esim. Keikka 1234 – vene karilla">' +
      '<label for="tFind">Hae paikka</label><div class="tfind"><input id="tFind" type="search" autocomplete="off" value="' + UI.esc(ctx.q || '') + '" placeholder="saari, kylä, turvalaite tai koordinaatit">' +
      '<div class="tsr" id="tRes" hidden></div></div>' +
      '<label for="tPos">Koordinaatit</label><div style="display:flex;gap:6px"><input id="tPos" value="' + (t.lat != null ? UI.esc(G.fmtPos(t)) : '') + '" placeholder="61°31,234\'N 023°45,678\'E"><button type="button" class="btn small" id="tPick">Poimi kartalta</button></div>' +
      '<div class="hint" id="tPrev">Asteet, minuutit ja sekunnit voi erottaa välilyönnein: <b>61 35,1N 23 45,2E</b> (asteet ja minuutit), <b>61 35 11N 23 45 30E</b> (asteet, minuutit ja sekunnit) tai <b>61,5N 23,75E</b> (asteet desimaaleina).</div>' +
      '<label for="tTime">Aika</label><input id="tTime" type="datetime-local" value="' + UI.esc(t.time || localDT(nowD)) + '">' +
      '<label for="tAct">Aktiivinen</label><div class="checks"><label><input type="checkbox" id="tAct"' + (t.active ? ' checked' : '') + '> näytä suuntima ja etäisyys asemalta</label></div>' +
      '<div class="err" id="tErr" hidden></div></div>';
    function keepForm(md) {
      t.name = md.querySelector('#tName').value; t.time = md.querySelector('#tTime').value; t.active = md.querySelector('#tAct').checked;
      var p = G.parsePos(md.querySelector('#tPos').value);
      if (p) { t.lat = p.lat; t.lng = p.lng; }
      ctx.q = md.querySelector('#tFind').value;
    }
    function reopen() { editTask(isNew ? null : orig.id, null, t, ctx, after); }
    UI.modal({
      title: isNew ? 'Uusi tehtäväpaikka' : 'Tehtäväpaikka', body: body, enterButton: 1,
      buttons: [{ label: 'Peruuta', action: function () { if (after) setTimeout(function () { after(null); }, 0); } }, {
        label: isNew ? 'Luo tehtävä' : 'Tallenna', primary: true, action: function (md) {
          var pos = G.parsePos(md.querySelector('#tPos').value);
          if (!pos) { var er = md.querySelector('#tErr'); er.textContent = 'Paikka puuttuu tai koordinaatteja ei tunnistettu. Hae paikka nimellä, poimi se kartalta tai tarkista koordinaattien muoto.'; er.hidden = false; return false; }
          t.name = md.querySelector('#tName').value.trim() || 'Tehtävä';
          t.lat = pos.lat; t.lng = pos.lng;
          t.time = md.querySelector('#tTime').value;
          var act = md.querySelector('#tAct').checked;
          var task = t;
          if (isNew) S.state.tasks.push(t); else { L.extend(orig, t); task = orig; }
          if (act) S.state.tasks.forEach(function (x) { x.active = x.id === task.id; }); else task.active = false;
          S.emit('tasks');
          App.centerOn([task.lat, task.lng], Math.max(map.getZoom(), 13));
          if (after) setTimeout(function () { after(task); }, 0);
        }
      }],
      onOpen: function (md) {
        var inp = md.querySelector('#tPos'), prev = md.querySelector('#tPrev'), hint0 = prev.innerHTML;
        function preview() {
          var v = inp.value.trim();
          if (!v) { prev.innerHTML = hint0; prev.className = 'hint'; return; }
          var p = G.parsePos(v);
          if (p) {
            var same = ctx.place && Math.abs(ctx.place.lat - p.lat) < 5e-5 && Math.abs(ctx.place.lng - p.lng) < 5e-5;
            prev.innerHTML = same ? 'Paikka tarkistettu kartalla: <b>' + UI.esc(ctx.place.label) + '</b>, ' + UI.esc(G.fmtPos(p))
              : 'Tulkinta: <b>' + UI.esc(G.fmtPos(p)) + '</b>';
            prev.className = 'hint ok';
          } else {
            var hasN = /[NSP]/i.test(v), hasE = /[EWIL]/i.test(v.replace(/[0-9\s,.'°"]/g, ''));
            prev.textContent = hasN && !hasE ? 'Leveys tunnistettu – lisää vielä pituus (E).' : 'Koordinaatteja ei vielä tunnistettu.';
            prev.className = 'hint bad';
          }
        }
        inp.addEventListener('input', preview);
        if (inp.value) preview();
        md.querySelector('#tPick').addEventListener('click', function () {
          keepForm(md);
          UI.closeModal();
          pick('Tehtäväpaikka – ' + (UI.isTouch() ? 'napauta' : 'klikkaa') + ' paikka kartalta', function (ll) {
            t.lat = ll.lat; t.lng = ll.lng; ctx.place = null;
            reopen();
          });
        });

        // --- paikkahaku ---
        var fin = md.querySelector('#tFind'), box = md.querySelector('#tRes'), timer = null, seq = 0;
        function show(list, pending) {
          if (!fin.value.trim()) { box.hidden = true; box.innerHTML = ''; return; }
          var h = '';
          if (!list.length) h = '<div class="sn">' + (pending ? 'Haetaan…' : 'Ei osumia. Kokeile nimen osaa, esim. viitas.') + '</div>';
          else {
            h = '<div class="sn">Valitse paikka, niin se näytetään kartalla tarkistettavaksi. Etäisyys ja suunta kartan keskeltä.</div>';
            var nearDone = false;
            list.forEach(function (it, i) {
              if (!nearDone && it.km > global.Search.NEAR_KM) { nearDone = true; if (i) h += '<div class="sh">Kauempana</div>'; }
              h += '<div class="sr" data-i="' + i + '"><i class="sn-no">' + (i + 1) + '</i>' +
                '<div class="sr-t"><b>' + UI.esc(it.name) + '</b><span>' + UI.esc(it.info || '') + '</span></div>' +
                '<em>' + G.fmtNM(it.km * 1000) + ' · ' + G.fmtBrg(it.brg, 0) + '</em></div>';
            });
            if (pending) h += '<div class="sn">Haetaan lisää…</div>';
          }
          var note = !pending && fin.value.trim().length >= 3 ? global.Search.namesNote() : '';
          if (note) h += '<div class="sn">' + UI.esc(note) + '</div>';
          box.innerHTML = h; box.hidden = false;
        }
        function runFind() {
          var q = fin.value.trim(), my = ++seq;
          if (q.length < 2) { ctx.results = []; show([], false); return; }
          var c = map.getCenter();
          ctx.ref = { lat: c.lat, lng: c.lng };
          show([], true);
          global.Search.find(q, ctx.ref).then(function (list) {
            if (my !== seq) return;
            ctx.results = list.slice(0, 30); ctx.resQ = q;
            show(ctx.results, false);
          });
        }
        fin.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(runFind, 350); });
        fin.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault(); e.stopPropagation();
            clearTimeout(timer);
            if (ctx.results.length && fin.value.trim() === ctx.resQ) { choose(0); return; }
            runFind();
          }
        });
        function choose(i) {
          keepForm(md);
          UI.closeModal();
          verifyTaskPlace(t, ctx, i, reopen);
        }
        box.addEventListener('click', function (e) {
          var el = e.target.closest('.sr');
          if (el) choose(Number(el.dataset.i));
        });
        if (ctx.results.length) show(ctx.results, false);
        // uudelle tehtävälle ilman paikkaa kohdistus suoraan hakuun
        if (isNew && t.lat == null) setTimeout(function () { fin.focus(); }, 40);
      }
    });
  }

  // Tehtäväpaikan tarkistus kartalla: valittu hakutulos keskitetään ja merkitään siirrettävällä merkillä,
  // muut osumat näkyvät numeroituina (napautus vaihtaa). Kartan napautus siirtää merkin siihen kohtaan.
  var verifyLayer = null;
  function verifyTaskPlace(t, ctx, idx, back) {
    var list = ctx.results, cur = list[idx], pos = L.latLng(cur.lat, cur.lng), label = cur.name, moved = false, done = false;
    if (verifyLayer) map.removeLayer(verifyLayer);
    verifyLayer = L.layerGroup().addTo(map);
    var cand = null;
    function bannerText() {
      return 'Tarkista tehtäväpaikka: ' + label + (moved ? ' (siirretty)' : '') + ', ' + G.fmtPos(pos) + '. ' +
        (UI.isTouch() ? 'Napauta karttaa tai vedä merkkiä, jos paikkaa pitää tarkentaa.' : 'Klikkaa karttaa tai vedä merkkiä, jos paikkaa pitää tarkentaa.');
    }
    function draw() {
      verifyLayer.clearLayers();
      list.forEach(function (it, i) {
        var on = it === cur;
        if (on) return;          // valittu paikka näkyy tarkistusrenkaana
        var m = L.marker([it.lat, it.lng], {
          icon: L.divIcon({ className: 'sres-ico', html: '<span class="sres' + (on ? ' on' : '') + '">' + (i + 1) + '</span>', iconSize: [0, 0] }),
          keyboard: false, zIndexOffset: on ? 1000 : 0, pane: it.ais ? 'markerPane' : 'aidPane', bubblingMouseEvents: false
        });
        m.bindTooltip(UI.esc(it.name) + (it.info ? ' – ' + UI.esc(it.info) : ''), { direction: 'top', offset: [0, -12] });
        m.on('click', function (e) { L.DomEvent.stop(e); cur = it; label = it.name; moved = false; pos = L.latLng(it.lat, it.lng); draw(); App.centerOn(pos); banner(); });
        m.addTo(verifyLayer);
      });
      cand = L.marker(pos, {
        icon: L.divIcon({ className: 'tv-ico', html: '<span class="tv-ring"></span><span class="tv-dot"></span>', iconSize: [0, 0] }),
        draggable: true, keyboard: false, zIndexOffset: 2000, bubblingMouseEvents: false
      }).addTo(verifyLayer);
      cand.on('dragend', function () { pos = cand.getLatLng(); moved = true; banner(); });
    }
    function finish(ok) {
      done = true;
      if (ok) {
        t.lat = pos.lat; t.lng = pos.lng;
        ctx.place = { lat: pos.lat, lng: pos.lng, label: label + (moved ? ' (siirretty)' : '') };
        // oletusnimeen lisätään paikan nimi, jos käyttäjä ei ole nimennyt tehtävää itse
        if (/^Tehtävä \d\d:\d\d$/.test(t.name || '')) t.name = t.name + ' – ' + label;
      }
      App.clearMode();
    }
    function banner() {
      UI.banner({
        kind: 'adding', text: bannerText(),
        buttons: [
          { label: 'Takaisin', action: function () { finish(false); } },
          { label: 'Vahvista paikka', action: function () { finish(true); } }
        ]
      });
    }
    App.setMode('pick', {
      label: 'Tehtäväpaikan tarkistus', cursor: true,
      click: function (e) { pos = e.latlng; moved = true; cand.setLatLng(pos); banner(); },
      cancel: function () {
        if (verifyLayer) { map.removeLayer(verifyLayer); verifyLayer = null; }
        UI.banner(null);
        if (global.Routes && global.Routes.editingId) global.Routes.updateBanner();
        // Esc ja Takaisin palaavat lomakkeelle; jos käyttäjä aloitti toisen työkalun, lomaketta ei avata
        var confirmed = done;
        setTimeout(function () { if (confirmed || App.mode() === 'idle') back(); }, 0);
      }
    });
    draw();
    banner();
    App.centerOn(pos, Math.max(map.getZoom(), 13));
  }

  function updateTaskReadout() {
    var t = S.state.tasks.find(function (x) { return x.active; });
    if (!t) { UI.readout({ task: null }); return; }
    var st = S.state.settings.station;
    if (st) UI.readout({ task: G.fmtBrg(G.bearing(st, t), 0) + '  ' + G.fmtNM(G.distance(st, t)) + ' asemalta' });
    else UI.readout({ task: G.fmtPos(t) });
  }

  // ---------- asema ----------
  function renderStation() {
    stationLayer.clearLayers();
    var st = S.state.settings.station;
    if (!st) return;
    var svg = '<svg viewBox="0 0 24 24" width="24" height="24"><rect x="3" y="3" width="18" height="18" rx="3" fill="#0f5e86" stroke="#fff" stroke-width="1.6"/>' +
      '<path d="M12 6v12M8.5 9h7M6.8 13.5c.8 2.6 2.8 4 5.2 4s4.4-1.4 5.2-4" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>';
    var mk = L.marker([st.lat, st.lng], {
      icon: L.divIcon({ className: 'mk', html: svg + '<span class="mk-name">' + UI.esc(st.name || 'Asema') + '</span>', iconSize: [24, 24], iconAnchor: [12, 12] }),
      keyboard: false, bubblingMouseEvents: false, zIndexOffset: 650
    });
    mk.on('contextmenu', function (e) {
      L.DomEvent.stop(e);
      UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
        { label: 'Suuntima asemalta', action: function () { startEbl({ lat: st.lat, lng: st.lng }); } },
        { label: 'Uusi reitti asemalta', action: function () { startRouteAt(L.latLng(st.lat, st.lng)); } },
        { label: 'Reititä asemalta väylää pitkin…', action: function () { global.Routing.dialog({ from: { lat: st.lat, lng: st.lng, label: st.name || 'Asema' } }); } },
        { label: 'Nimeä asema…', action: function () { nameStation(st); } },
        { sep: true },
        { label: 'Poista asema', action: function () { S.state.settings.station = null; S.emit('settings'); } }
      ], st.name || 'Asema');
    });
    mk.addTo(stationLayer);
  }

  function nameStation(st, isNew) {
    UI.modal({
      title: isNew ? 'Aseta asema' : 'Nimeä asema',
      body: '<div class="form"><label for="sName">Nimi</label><input id="sName" value="' + UI.esc(st.name || 'Asema') + '"><div class="hint">Asemalta lasketaan aktiivisen tehtävän suuntima ja etäisyys.</div></div>',
      enterButton: 1,
      buttons: [{ label: 'Peruuta' }, { label: 'Tallenna', primary: true, action: function (md) {
        st.name = md.querySelector('#sName').value.trim() || 'Asema';
        S.state.settings.station = st; S.emit('settings');
      } }]
    });
  }

  function startRouteAt(ll) {
    global.Routes.startNew();
    // ensimmäinen piste suoraan annettuun kohtaan
    App.dispatchClick(ll);
  }

  // ---------- kartan kontekstivalikko ----------
  function mapMenu(e) {
    var ll = e.latlng;
    var pos = G.fmtPos(ll);
    UI.menu(e.originalEvent.clientX, e.originalEvent.clientY, [
      { label: 'Lisää merkki tähän', action: function () { editMark(null, ll); } },
      { label: 'Lisää tehtävä tähän', action: function () { editTask(null, ll); } },
      { label: 'Aseta asema tähän', action: function () { nameStation({ lat: ll.lat, lng: ll.lng, name: (S.state.settings.station || {}).name || 'Asema' }, true); } },
      { sep: true },
      { label: 'Uusi reitti tästä', key: 'Ctrl+R', action: function () { startRouteAt(ll); } },
      { label: 'Reititä tähän väylää pitkin…', action: function () { global.Routing.dialog({ to: { lat: ll.lat, lng: ll.lng, label: '' } }); } },
      { label: 'Harppi tästä', key: 'M', action: function () { startMeasure(ll); } },
      { label: 'Suuntima tästä', key: 'F6', action: function () { startEbl({ lat: ll.lat, lng: ll.lng }); } },
      { sep: true },
      { label: 'Kopioi koordinaatit', action: function () { copyText(pos); } },
      { label: 'Keskitä kartta tähän', action: function () { App.centerOn(ll); } }
    ], pos);
  }

  function copyText(s) {
    var ok = function () { UI.toast('Kopioitu: ' + s); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(ok, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) { UI.toast('Kopiointi ei onnistunut: ' + s, true); }
      ta.remove();
    }
  }

  function render() { renderMarks(); renderTasks(); renderStation(); }

  function init(m, app) {
    map = m; App = app;
    tempLayer = L.layerGroup().addTo(map);
    markLayer = L.layerGroup().addTo(map);
    stationLayer = L.layerGroup().addTo(map);
    taskLayer = L.layerGroup().addTo(map);
    render();
  }

  global.Tools = {
    init: init, render: render, renderMarks: renderMarks, renderTasks: renderTasks, renderStation: renderStation,
    startMeasure: startMeasure, startEbl: startEbl, editMark: editMark, editTask: editTask, mapMenu: mapMenu,
    setActiveTask: setActiveTask, typeName: typeName, markSvg: markSvg, fmtTime: fmtTime, pick: pick,
    updateTaskReadout: updateTaskReadout, copyText: copyText
  };
})(window);

</script>
<script>
/* Reittikartta – reittikirjasto (oikea paneeli): reitit, merkit ja tehtävät. */
(function (global) {
  'use strict';

  var G = global.Geo, S = global.Store, UI = global.UI;
  var map, App;
  var selRoute = null;
  var tab = 'routes';

  function fmtDate(s) {
    if (!s) return '';
    var d = new Date(s);
    return isNaN(d) ? '' : d.toLocaleDateString('fi-FI');
  }

  function routeItem(r) {
    var len = global.Routes.totalLen(r);
    var color = r.status === 'approved' ? 'var(--approved)' : 'var(--draft)';
    var meta = r.status === 'approved'
      ? (r.vessels || []).join(', ') + (r.approver ? ' · ' + r.approver : '')
      : 'Luonnos' + (r.modified ? ' · muokattu ' + fmtDate(r.modified) : '');
    return '<div class="item' + (r.id === selRoute ? ' sel' : '') + '" data-id="' + r.id + '" tabindex="0">' +
      '<span class="sw" style="background:' + color + '"></span>' +
      '<div style="min-width:0"><div class="nm">' + UI.esc(r.name || 'Nimetön reitti') + '</div><div class="meta">' + UI.esc(meta) + '</div></div>' +
      '<div class="side">' + G.fmtNM(len) + '<br>' + Math.max(0, r.points.length - 1) + ' legiä</div></div>';
  }

  function renderRoutes() {
    var el = UI.$('tab-routes');
    var st = S.state.settings;
    var routes = S.state.routes.filter(function (r) { return r.points.length >= 2; });
    var drafts = routes.filter(function (r) { return r.status !== 'approved'; });
    var noVessel = !st.currentVessel;      // aluksia ei ole lisätty: kaikki hyväksytyt samaan ryhmään
    var mine = routes.filter(function (r) { return r.status === 'approved' && (noVessel || (r.vessels || []).indexOf(st.currentVessel) >= 0); });
    var others = routes.filter(function (r) { return r.status === 'approved' && !noVessel && (r.vessels || []).indexOf(st.currentVessel) < 0; });
    var h = '<div class="p-actions">' +
      '<button class="btn primary" data-act="new">Uusi reitti</button>' +
      '<button class="btn" data-act="import">Tuo GPX…</button>' +
      '<button class="btn" data-act="exportAll"' + (routes.length ? '' : ' disabled') + '>Vie kirjasto GPX</button></div>';
    if (!routes.length) {
      h += '<div class="empty">Kirjastossa ei ole vielä reittejä.<br>Aloita <b>Uusi reitti</b> -painikkeella' + (UI.isTouch() ? ' ja napauta' : ' (Ctrl+R) ja klikkaa') + ' reittipisteet kartalle, tai tuo SARNavista viety GPX-tiedosto.</div>';
    } else {
      h += '<div class="group-h">Hyväksytyt' + (noVessel ? '' : ' – ' + UI.esc(st.currentVessel)) + ' (' + mine.length + ')</div><div class="list">' + (mine.map(routeItem).join('') || '<div class="empty">' + (noVessel ? 'Ei hyväksyttyjä reittejä.' : 'Ei tälle alukselle hyväksyttyjä reittejä.') + '</div>') + '</div>';
      h += '<div class="group-h">Luonnokset (' + drafts.length + ')</div><div class="list">' + (drafts.map(routeItem).join('') || '<div class="empty">Ei luonnoksia.</div>') + '</div>';
      if (others.length) {
        h += '<div class="group-h">Muille aluksille hyväksytyt (' + others.length + ')' + (st.routeFilter === 'vessel' ? ' – piilossa kartalla' : '') + '</div><div class="list">' + others.map(routeItem).join('') + '</div>';
      }
    }
    var r = selRoute && S.routeById(selRoute);
    if (r) h += detail(r);
    el.innerHTML = h;
    // valitun reitin tiedot näkyviin: puhelimessa ne ovat muuten alalevyn näkyvän osan alapuolella
    if (scrollDetail && r) {
      scrollDetail = false;
      var d = el.querySelector('.detail');
      if (d) el.scrollTop = Math.max(0, d.offsetTop - el.offsetTop - 6);
    }

    el.querySelectorAll('.item').forEach(function (it) {
      it.addEventListener('click', function () { select(it.dataset.id, true); });
      it.addEventListener('keydown', function (e) { if (e.key === 'Enter') select(it.dataset.id, true); });
      it.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        var id = it.dataset.id;
        select(id, false);
        UI.menu(e.clientX, e.clientY, [
          { label: 'Ominaisuudet…', action: function () { global.Routes.openProperties(id); } },
          { label: 'Muokkaa reittiä ja merkkejä', action: function () { global.Routes.enterEdit(id); global.Routes.center(id); } },
          { label: 'Keskitä reittiin', action: function () { global.Routes.center(id); } },
          { label: 'Vie GPX-tiedostoksi', action: function () { global.Routes.exportRoute(id); } },
          { sep: true },
          { label: 'Poista reitti…', action: function () { global.Routes.deleteRoute(id); } }
        ], 'Reittikirjasto');
      });
    });
    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () { action(b.dataset.act, b.dataset.id); });
    });
  }

  function detail(r) {
    var ls = global.Routes.legs(r);
    var speed = r.speed || S.state.settings.speed;
    var cum = 0;
    var rows = ls.map(function (l) {
      cum += l.dist;
      var sn = function (k) { return r.points[k] && r.points[k].snap ? '<span title="Kiinnitetty väylän pisteeseen" style="color:#c2188b">◆</span>' : ''; };
      return '<tr><td>' + sn(l.i) + (l.i + 1) + '→' + (l.i + 2) + sn(l.i + 1) + '</td><td>' + G.fmtBrg(l.brg, 0) + '</td><td>' + G.fmtNum(l.dist / G.NM, 2) + '</td><td>' + G.fmtNum(cum / G.NM, 2) + '</td><td>' + G.fmtDuration(l.dist / G.NM / speed) + '</td></tr>';
    }).join('');
    var editing = global.Routes.editingId === r.id;
    // puhelimessa toimintopainikkeet heti nimen alle, jotta ne näkyvät alalevyssä ilman vieritystä
    var phone = UI.isPhone();
    var actions = '<div class="p-actions">' +
      (editing ? '<button class="btn" data-act="stopEdit">Lopeta muokkaus</button>' : '<button class="btn" data-act="edit" data-id="' + r.id + '">Muokkaa</button>') +
      '<button class="btn" data-act="props" data-id="' + r.id + '">Ominaisuudet</button>' +
      '<button class="btn" data-act="center" data-id="' + r.id + '">Keskitä</button>' +
      '<button class="btn" data-act="gpx" data-id="' + r.id + '">Vie GPX</button>' +
      '<button class="btn danger" data-act="del" data-id="' + r.id + '">Poista</button></div>';
    return '<div class="detail"><h3>' + UI.esc(r.name || 'Nimetön reitti') + '</h3>' +
      '<span class="chip ' + (r.status === 'approved' ? 'approved' : 'draft') + '">' + (r.status === 'approved' ? 'Hyväksytty' : 'Luonnos') + '</span>' +
      (editing ? '<span class="chip">Muokkaustilassa</span>' : '') +
      (phone ? actions : '') +
      '<div class="kv">' +
      '<span>Mistä</span><b>' + UI.esc(r.from || '–') + '</b>' +
      '<span>Kautta</span><b>' + UI.esc(r.via || '–') + '</b>' +
      '<span>Mihin</span><b>' + UI.esc(r.to || '–') + '</b>' +
      '<span>Pituus</span><b>' + G.fmtNM(global.Routes.totalLen(r)) + '</b>' +
      '<span>Ajoaika</span><b>' + G.fmtDuration(global.Routes.totalLen(r) / G.NM / speed) + ' (' + speed + ' kn)</b>' +
      (r.status === 'approved' ? '<span>Hyväksyjä</span><b>' + UI.esc(r.approver || '–') + ', ' + fmtDate(r.approvedAt) + '</b><span>Alukset</span><b>' + UI.esc((r.vessels || []).join(', ') || '–') + '</b>' : '') +
      '<span>Nuotit</span><b>' + r.notes.length + ' (' + r.notes.filter(function (n) { return n.ok; }).length + ' vahvistettu)</b>' +
      '<span>Väyläkiinnitys</span><b>' + r.points.filter(function (p) { return p.snap; }).length + ' / ' + r.points.length + ' reittipistettä</b>' +
      '<span>Sivuutukset</span><b>' + r.passes.length + '</b><span>Käännökset</span><b>' + r.turns.length + '</b>' +
      (r.passes.length + r.turns.length ? '<span>Turvalaitekiinnitys</span><b>' + r.passes.concat(r.turns).filter(function (x) { return x.tgt && x.tgt.aid; }).length + ' / ' + (r.passes.length + r.turns.length) + ' kohdetta</b>' : '') +
      '</div>' +
      (r.desc ? '<p class="meta">' + UI.esc(r.desc) + '</p>' : '') +
      (phone ? '' : actions) +
      '<div class="tbl-wrap"><table class="legs"><thead><tr><th>Legi</th><th>Suunta</th><th>mpk</th><th>Kertymä</th><th>Aika</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }

  function action(act, id) {
    var R = global.Routes;
    // puhelimessa kirjasto peittää kartan alaosan: suljetaan se, kun toiminto tapahtuu kartalla
    if (UI.isPhone() && ['new', 'edit', 'center', 'newMark'].indexOf(act) >= 0) App.closePanel();
    switch (act) {
      case 'new': R.startNew(); break;
      case 'import': App.importFile(); break;
      case 'exportAll': App.exportLibrary(); break;
      case 'edit': R.enterEdit(id); R.center(id); break;
      case 'stopEdit': R.finishEdit(); break;
      case 'props': R.openProperties(id); break;
      case 'center': R.center(id); break;
      case 'gpx': R.exportRoute(id); break;
      case 'del': R.deleteRoute(id); break;
      case 'newMark': Tools().pick('Uusi merkki – klikkaa paikka kartalta', function (ll) { Tools().editMark(null, ll); }); break;
      case 'newTask': Tools().editTask(null, null); break;
      case 'routeTask': global.Routing.taskDialog(); break;
    }
  }
  function Tools() { return global.Tools; }

  var scrollDetail = false;
  function select(id, centerIt) {
    selRoute = id; scrollDetail = true;
    global.Routes.setHighlight(id);
    if (centerIt) {
      var r = S.routeById(id);
      if (r && r.points.length) {
        var b = L.latLngBounds(r.points.map(function (p) { return [p.lat, p.lng]; }));
        if (!map.getBounds().contains(b)) global.Routes.center(id);
      }
    }
    render();
  }

  function renderMarks() {
    var el = UI.$('tab-marks');
    var h = '<div class="p-actions"><button class="btn primary" data-act="newMark">Uusi merkki</button></div>';
    if (!S.state.marks.length) h += '<div class="empty">Omat merkit täydentävät karttaa: uudet viitat, kivet, matalikot, nopeusrajoitukset. Lisää merkki kartalta ' + (UI.isTouch() ? 'pitkällä painalluksella' : 'hiiren oikealla painikkeella') + ': <b>Lisää merkki tähän</b>.</div>';
    else {
      h += '<div class="list">' + S.state.marks.map(function (m) {
        return '<div class="item" data-id="' + m.id + '" tabindex="0"><span class="sw" style="background:' + (m.status === 'approved' ? 'var(--approved)' : 'var(--draft)') + '"></span>' +
          '<div style="min-width:0;display:flex;gap:8px;align-items:center">' + Tools().markSvg(m.type) +
          '<div style="min-width:0"><div class="nm">' + UI.esc(m.name || Tools().typeName(m.type)) + '</div><div class="meta">' + UI.esc(Tools().typeName(m.type)) + ' · ' + G.fmtPos(m) + '</div></div></div>' +
          '<div class="side">' + (m.status === 'approved' ? 'kirjasto' : 'luonnos') + '</div></div>';
      }).join('') + '</div>';
    }
    el.innerHTML = h;
    el.querySelectorAll('.item').forEach(function (it) {
      var m = S.markById(it.dataset.id);
      it.addEventListener('click', function () { App.centerOn([m.lat, m.lng], Math.max(map.getZoom(), 14)); });
      it.addEventListener('dblclick', function () { Tools().editMark(m.id); });
      it.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        UI.menu(e.clientX, e.clientY, [
          { label: 'Ominaisuudet…', action: function () { Tools().editMark(m.id); } },
          { label: 'Keskitä', action: function () { App.centerOn([m.lat, m.lng], Math.max(map.getZoom(), 14)); } },
          { label: 'Poista merkki…', action: function () {
            UI.confirm('Poistetaanko merkki "' + (m.name || Tools().typeName(m.type)) + '"?', 'Poista', function () {
              S.state.marks = S.state.marks.filter(function (x) { return x.id !== m.id; }); S.emit('marks');
            }, true);
          } }
        ], m.name || 'Merkki');
      });
    });
    el.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', function () { action(b.dataset.act); }); });
  }

  function renderTasks() {
    var el = UI.$('tab-tasks');
    var st = S.state.settings.station;
    var h = '<div class="p-actions"><button class="btn primary" data-act="newTask">Uusi tehtävä</button>' +
      (S.state.tasks.length ? '<button class="btn" data-act="routeTask">Reititä tehtävälle</button>' : '') + '</div>';
    if (!st) h += '<div class="meta" style="margin-bottom:8px">Aseta asema kartalta (' + (UI.isTouch() ? 'pitkä painallus' : 'oikea painike') + ' → <b>Aseta asema tähän</b>), niin tehtävän suuntima ja etäisyys asemalta näkyvät.</div>';
    if (!S.state.tasks.length) h += '<div class="empty">Ei tehtäviä. Kun saat tehtävän koordinaatit, valitse <b>Uusi tehtävä</b> ja kirjoita koordinaatit hälytysviestistä. Tehtäväpaikka näkyy kartalla kaksoisympyränä.</div>';
    else {
      var list = S.state.tasks.slice().sort(function (a, b) { return String(b.time).localeCompare(String(a.time)); });
      h += '<div class="list">' + list.map(function (t) {
        var side = st ? G.fmtBrg(G.bearing(st, t), 0) + '<br>' + G.fmtNM(G.distance(st, t)) : '';
        return '<div class="item' + (t.active ? ' sel' : '') + '" data-id="' + t.id + '" tabindex="0"><span class="sw" style="background:' + (t.active ? '#c8102e' : 'var(--ui-line)') + '"></span>' +
          '<div style="min-width:0"><div class="nm">' + UI.esc(t.name || 'Tehtävä') + (t.active ? ' · aktiivinen' : '') + '</div><div class="meta">' + UI.esc(Tools().fmtTime(t.time)) + ' · ' + G.fmtPos(t) + '</div></div>' +
          '<div class="side">' + side + '</div></div>';
      }).join('') + '</div>';
    }
    el.innerHTML = h;
    el.querySelectorAll('.item').forEach(function (it) {
      var t = S.taskById(it.dataset.id);
      it.addEventListener('click', function () { App.centerOn([t.lat, t.lng], Math.max(map.getZoom(), 13)); });
      it.addEventListener('dblclick', function () { Tools().editTask(t.id); });
      it.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        UI.menu(e.clientX, e.clientY, [
          { label: 'Ominaisuudet…', action: function () { Tools().editTask(t.id); } },
          { label: t.active ? 'Poista aktiivisuus' : 'Aseta aktiiviseksi', action: function () { Tools().setActiveTask(t.active ? null : t.id); } },
          { label: 'Reititä tehtävälle väylää pitkin…', action: function () { global.Routing.taskDialog(t.id); } },
          { label: 'Kopioi koordinaatit', action: function () { Tools().copyText(G.fmtPos(t)); } },
          { label: 'Poista tehtävä…', action: function () {
            UI.confirm('Poistetaanko tehtävä "' + (t.name || 'Tehtävä') + '"?', 'Poista', function () {
              S.state.tasks = S.state.tasks.filter(function (x) { return x.id !== t.id; }); S.emit('tasks');
            }, true);
          } }
        ], t.name || 'Tehtävä');
      });
    });
    el.querySelectorAll('[data-act]').forEach(function (b) { b.addEventListener('click', function () { action(b.dataset.act); }); });
  }

  function setTab(name) {
    tab = name;
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.tab === name); });
    ['routes', 'marks', 'tasks'].forEach(function (n) { UI.$('tab-' + n).hidden = n !== name; });
    render();
  }

  function render() {
    if (selRoute && !S.routeById(selRoute)) selRoute = null;
    if (tab === 'routes') renderRoutes();
    else if (tab === 'marks') renderMarks();
    else renderTasks();
  }

  function init(m, app) {
    map = m; App = app;
    document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
    global.Routes.onChange(function (what) {
      if (what === 'highlight' && global.Routes.highlightId !== selRoute) selRoute = global.Routes.highlightId;
      render();
    });
    render();
  }

  global.Library = { init: init, render: render, setTab: setTab, select: select };
})(window);

</script>
<script>
/* Reittikartta – AIS-alukset.
 * Alusten sijainnit ja alustiedot haetaan Fintrafficin Digitraffic Marine -rajapinnasta
 * (meri.digitraffic.fi, lisenssi CC BY 4.0) ja piirretään kartalle omaan paneeseensa.
 * Moduuli huolehtii myös tiedon haun ajastuksesta, aluksen kortista sekä alusten hausta
 * nimellä, kutsutunnuksella ja MMSI-numerolla. Haku on käynnissä vain silloin, kun kerros
 * on päällä ja sivu näkyvissä. Tieto on viiveellistä, eikä se sovellu navigointiin tai
 * törmäysten välttämiseen. */
(function (global) {
  'use strict';

  var G = global.Geo, S = global.Store, UI = global.UI;

  var API = 'https://meri.digitraffic.fi/api/ais/v1';
  var USER = 'Reittikartta';                 // Fintraffic pyytää sovelluksia tunnistautumaan tällä otsakkeella
  var ATTR = 'AIS: <a href="https://www.digitraffic.fi/meriliikenne/" target="_blank" rel="noopener">Fintraffic / Digitraffic</a>, CC BY 4.0';

  // hakujen ajastus
  var POS_MS = 30000;                        // sijaintien päivitys
  var POS_FULL_MS = 600000;                  // koko aineisto haetaan uudelleen, jolloin vanhat poistuvat
  var VES_MS = 900000;                       // alustietojen päivitys
  var VES_WINDOW_MS = 7 * 86400000;          // ensimmäisellä haulla alustiedot seitsemän vuorokauden ajalta
  var OVERLAP_MS = 60000;                    // päivityshaut alkavat minuutin ennen edellistä, ettei mitään jää väliin
  var FRESH_MS = 120000;                     // haun ajaksi kerroksen ollessa pois päältä riittävän tuore aineisto

  // piirto
  var PANE_Z = 465;                          // chart.js: aidPane 460, flarePane 455, labelPane 450. Leafletin markerPane 600 jää tämän päälle
  var MIN_Z = 8;                             // alukset näkyvät tästä zoomaustasosta alkaen
  var LABEL_Z = 12;                          // nimet tästä tasosta alkaen
  var LABEL_Z_SAR = 10;                      // pelastusalusten nimet jo tästä tasosta alkaen
  var MAX_DRAWN = 400;
  var MOVING_KN = 0.5;                       // tätä nopeammin kulkeva alus on liikkeessä
  var DIM_MS = 600000;                       // yli 10 minuuttia vanha sijainti himmeänä
  var DIM_OPACITY = 0.45;
  var MAX_AGE_MS = 3600000;                  // yli tunnin vanhaa sijaintia ei piirretä eikä haeta
  var VECTOR_MIN = 0.1;                      // nopeusvektori: 6 minuuttia eli 0,1 tuntia
  var GRAY = '#9aa3ab';
  var SAR = '#ff6a13';
  var EDGE = '#0d1b26';

  var map, layer, noteEl = null, attrOn = false;
  var pos = {};                              // MMSI -> { lat, lng, t, sog, cog, heading, navStat }
  var ves = {};                              // MMSI -> alustiedot
  var noVes = {};                            // MMSI, joille rajapinta vastasi 404, jottei samaa kysytä uudelleen
  var drawn = {};                            // MMSI -> kartalla oleva merkki
  var lastMax = 0, lastFullAt = 0, posOkAt = 0, vesAt = 0, vesLoaded = false;
  var inflightPos = null, inflightVes = null, failStreak = 0;
  var running = false, busy = false, timer = null, renderTimer = null;
  var pinned = null, pendingOpen = null, openTimer = null, openMmsi = null;
  var singleQ = [], singleBusy = 0, singleWait = {}, singleFail = {};

  // ---------- apufunktiot ----------
  function enabled() { var sh = S.state.settings.show; return !sh || sh.ais !== false; }
  function visible() { return document.visibilityState !== 'hidden'; }
  // AIS-nimissä on usein @-täytemerkkejä ja ylimääräisiä välilyöntejä
  function clean(s) { return String(s == null ? '' : s).replace(/@+/g, ' ').replace(/\s+/g, ' ').trim(); }
  // vertailumuoto hakua varten: pienet kirjaimet ja ilman tarkkeita, jolloin ä ja ö löytävät A:n ja O:n
  function fold(s) {
    s = String(s == null ? '' : s).toLowerCase();
    try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) { /* vanha selain */ }
    return s;
  }
  function num(v) { var n = Number(v); return v != null && isFinite(n) ? n : null; }

  // ---------- tyypit ja tilat suomeksi ----------
  function typeColor(t) {
    if (t == null) return GRAY;
    if (t === 51) return SAR;
    if (t >= 70 && t <= 79) return '#2e9e44';
    if (t >= 80 && t <= 89) return '#d4282f';
    if (t >= 60 && t <= 69) return '#1f6fe0';
    if (t >= 40 && t <= 49) return '#e8c21a';
    if (t === 30) return '#a0672b';
    if (t === 36 || t === 37) return '#b05cd6';
    if ((t >= 31 && t <= 34) || t === 50 || (t >= 52 && t <= 59)) return '#19a7c6';
    if (t === 35) return '#6b7b8c';
    return GRAY;
  }
  function typeName(t) {
    if (t == null) return 'tuntematon';
    if (t >= 20 && t <= 29) return 'siipialus';
    if (t >= 40 && t <= 49) return 'pika-alus';
    if (t >= 60 && t <= 69) return 'matkustaja-alus';
    if (t >= 70 && t <= 79) return 'rahtialus';
    if (t >= 80 && t <= 89) return 'säiliöalus';
    if (t >= 90 && t <= 99) return 'muu alus';
    switch (t) {
      case 30: return 'kalastusalus';
      case 31: case 32: case 52: return 'hinaaja';
      case 33: return 'ruoppaaja';
      case 34: return 'sukellustoiminta';
      case 35: return 'sotilasalus';
      case 36: return 'purjealus';
      case 37: return 'huvialus';
      case 50: return 'luotsialus';
      case 51: return 'etsintä- ja pelastusalus';
      case 53: return 'satama-alus';
      case 54: return 'ympäristöntorjunta-alus';
      case 55: return 'viranomaisalus';
      case 58: return 'sairaankuljetus';
      default: return 'tuntematon';
    }
  }
  var NAV = {
    0: 'kulussa konevoimalla', 1: 'ankkurissa', 2: 'ei komennossa', 3: 'rajoitettu ohjailukyky', 4: 'syväyksensä rajoittama',
    5: 'kiinnitetty', 6: 'karilla', 7: 'kalastamassa', 8: 'purjehtimassa', 14: 'AIS-SART tai hätälähetin'
  };
  function navName(n) { return NAV[n] || 'ei määritelty'; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ETA on pakattu UTC-aika (kuukausi, päivä, tunti, minuutti). Puuttuvan arvon merkkinä ovat nolla kuukausi tai päivä, tunti 24 ja minuutti 60.
  function fmtEta(eta) {
    if (!eta || eta < 0) return '';
    var mo = (eta >> 16) & 15, d = (eta >> 11) & 31, h = (eta >> 6) & 31, mi = eta & 63;
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59) return '';
    return G.pad(d, 2) + '.' + G.pad(mo, 2) + '. ' + G.pad(h, 2) + ':' + G.pad(mi, 2) + ' UTC';
  }
  function fmtAge(ms) {
    var m = Math.floor(Math.max(0, ms) / 60000);
    if (m < 1) return 'alle minuutti sitten';
    if (m < 60) return m + ' min sitten';
    return Math.floor(m / 60) + ' h ' + G.pad(m % 60, 2) + ' min sitten';
  }

  // ---------- rajapintakutsut ----------
  // Ainoa oma otsake on Digitraffic-User. Aikakatkaisu estää jumiin jääneen haun tukkimasta ajastusta.
  function getJson(path, ms) {
    var ctl = global.AbortController ? new global.AbortController() : null;
    var to = ctl ? setTimeout(function () { ctl.abort(); }, ms || 30000) : null;
    var opts = { headers: { 'Digitraffic-User': USER } };
    if (ctl) opts.signal = ctl.signal;
    return fetch(API + path, opts).then(function (r) {
      if (r.status === 404) { var e = new Error('ei löytynyt'); e.status = 404; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { clearTimeout(to); return j; }, function (e) { clearTimeout(to); throw e; });
  }

  // Sijaintivastaus kootaan MMSI:n mukaan. Koko haku rakentaa aineiston alusta, päivityshaku yhdistyy aiempaan.
  function parsePositions(j, base, baseMax) {
    var fs = (j && j.features) || [], next = base, max = baseMax;
    var stamp = j && j.dataUpdatedTime ? Date.parse(j.dataUpdatedTime) : NaN;
    fs.forEach(function (f) {
      var p = f.properties || {}, c = f.geometry && f.geometry.coordinates;
      var mmsi = f.mmsi != null ? f.mmsi : p.mmsi;
      if (mmsi == null || !c || c.length < 2) return;
      var lng = Number(c[0]), lat = Number(c[1]);
      if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return;   // 91° ja 181° tarkoittavat, ettei sijaintia ole
      var t = Number(p.timestampExternal);
      if (!isFinite(t) || t <= 0) t = stamp;
      if (!isFinite(t) || t <= 0) return;
      var old = next[mmsi];
      if (old && old.t >= t) return;
      var sog = num(p.sog), cog = num(p.cog), hd = num(p.heading);
      next[mmsi] = {
        mmsi: String(mmsi), lat: lat, lng: lng, t: t,
        sog: sog != null && sog >= 0 && sog < 102.3 ? sog : null,
        cog: cog != null && cog >= 0 && cog < 360 ? cog : null,
        heading: hd != null && hd >= 0 && hd < 360 ? hd : null,
        navStat: num(p.navStat)
      };
      if (t > max) max = t;
    });
    return { pos: next, max: max, n: fs.length };
  }

  function normVessel(v) {
    var n = function (x) { x = num(x); return x != null && x > 0 ? x : 0; };
    var name = clean(v.name), call = clean(v.callSign);
    return {
      name: name, callSign: call, imo: n(v.imo), destination: clean(v.destination),
      draught: n(v.draught), eta: n(v.eta), shipType: num(v.shipType),
      a: n(v.referencePointA), b: n(v.referencePointB), c: n(v.referencePointC), d: n(v.referencePointD),
      nameKey: fold(name), callKey: fold(call).replace(/\s+/g, '')       // hakua varten
    };
  }

  function setNote() {
    if (!noteEl) return;
    var bad = enabled() && (failStreak >= 2 || (failStreak >= 1 && !posOkAt));
    noteEl.hidden = !bad;
  }

  // Jos sama haku on jo kesken, palautetaan sen lupaus. Lupaus ei koskaan hylkäydy, vaan antaa arvon true tai false.
  function loadPositions(full) {
    if (inflightPos) return inflightPos;
    var whole = !!full || !lastMax;
    var url = '/locations' + (whole ? '' : '?from=' + (lastMax - OVERLAP_MS));
    inflightPos = getJson(url).then(function (j) {
      var res = parsePositions(j, whole ? {} : pos, whole ? 0 : lastMax);
      // tyhjä vastaus koko haulle ei tyhjennä kartan aineistoa
      if (whole && !res.n && Object.keys(pos).length) throw new Error('tyhjä vastaus');
      pos = res.pos; lastMax = res.max;
      posOkAt = Date.now();
      if (whole) lastFullAt = posOkAt;
      failStreak = 0;
      return true;
    }).then(null, function () { failStreak++; return false; }).then(function (ok) {
      inflightPos = null; setNote();
      return ok;
    });
    return inflightPos;
  }

  function loadVessels(initial) {
    if (inflightVes) return inflightVes;
    var started = Date.now();
    var from = initial || !vesAt ? started - VES_WINDOW_MS : vesAt - OVERLAP_MS;
    inflightVes = getJson('/vessels?from=' + Math.round(from), 60000).then(function (arr) {
      if (!Array.isArray(arr)) throw new Error('virheellinen vastaus');
      arr.forEach(function (v) {
        if (!v || v.mmsi == null) return;
        ves[v.mmsi] = normVessel(v);
        delete noVes[v.mmsi];
      });
      vesAt = started; vesLoaded = true;
      return true;
    }).then(null, function () { return false; }).then(function (ok) { inflightVes = null; return ok; });
    return inflightVes;
  }

  // Yksittäisen aluksen tiedot haetaan vasta, kun alus avataan tai sen nimeä tarvitaan. Samanaikaisia kutsuja on enintään kolme.
  function needVessel(k) {
    if (ves[k]) return Promise.resolve(ves[k]);
    if (noVes[k]) return Promise.resolve(null);
    if (singleFail[k] && Date.now() - singleFail[k] < 120000) return Promise.resolve(null);
    if (singleWait[k]) return singleWait[k];
    if (singleQ.length >= 40) return Promise.resolve(null);
    singleWait[k] = new Promise(function (resolve) { singleQ.push({ k: k, resolve: resolve }); });
    pumpSingles();
    return singleWait[k];
  }
  function pumpSingles() {
    while (singleBusy < 3 && singleQ.length) {
      (function (job) {
        singleBusy++;
        getJson('/vessels/' + encodeURIComponent(job.k), 15000).then(function (v) {
          if (Array.isArray(v)) v = v[0];
          if (v && typeof v === 'object') { ves[job.k] = normVessel(v); job.resolve(ves[job.k]); }
          else { singleFail[job.k] = Date.now(); job.resolve(null); }
        }, function (e) {
          if (e && e.status === 404) noVes[job.k] = true; else singleFail[job.k] = Date.now();
          job.resolve(null);
        }).then(function () { singleBusy--; delete singleWait[job.k]; pumpSingles(); });
      })(singleQ.shift());
    }
  }

  // ---------- ajastus ----------
  function tick() {
    if (!running || busy) return;
    busy = true;
    var full = !lastFullAt || Date.now() - lastFullAt >= POS_FULL_MS;
    var jobs = [loadPositions(full)];
    if (!vesLoaded || Date.now() - vesAt >= VES_MS) jobs.push(loadVessels(!vesLoaded));
    Promise.all(jobs).then(function () { busy = false; render(); }, function () { busy = false; });
  }
  // Haku käy vain, kun kerros on päällä ja sivu näkyvissä. Sivun tullessa näkyviin haetaan heti.
  function sync() {
    if (!map) return;
    var on = enabled(), want = on && visible();
    if (want && !running) { running = true; tick(); timer = setInterval(tick, POS_MS); }
    else if (!want && running) { running = false; clearInterval(timer); timer = null; }
    if (on !== attrOn) {
      attrOn = on;
      if (on) map.attributionControl.addAttribution(ATTR); else map.attributionControl.removeAttribution(ATTR);
    }
    setNote();
    if (on) render(); else clearAll();
  }

  // ---------- piirto ----------
  function kindOf(p, v) {
    var t = v ? v.shipType : null, sog = p.sog;
    var moving = sog != null && sog >= MOVING_KN;
    // laiturissa tai ankkurissa olevan aluksen GPS-kohina ei tee siitä liikkuvaa
    if (moving && (p.navStat === 1 || p.navStat === 5) && sog < 2) moving = false;
    var dir = p.heading != null ? p.heading : p.cog;
    return { rescue: t === 51, moving: moving, color: typeColor(t), dir: dir, arrow: moving && dir != null, vdir: p.cog != null ? p.cog : p.heading };
  }

  // Merkki: liikkuva alus on keulasuuntaan kierretty nuolenkärki, muut ympyrä. Pelastusalus on suurempi ja sen reuna paksumpi.
  function halfOf(kind) {
    if (kind.arrow) return (kind.rescue ? 27 : 22) / 2;
    return (kind.rescue ? 15 : 10) / 2;
  }
  function shapeSvg(kind) {
    var c = kind.color;
    if (kind.arrow) {
      var w = kind.rescue ? 17 : 14, ht = kind.rescue ? 27 : 22, sw = kind.rescue ? 1.7 : 1;
      return '<svg class="ais-s" width="' + w + '" height="' + ht + '" viewBox="0 0 14 22" style="transform:rotate(' + Math.round(kind.dir) + 'deg)" aria-hidden="true">' +
        '<path d="M7 1.2L12.6 20.2L7 16.4L1.4 20.2Z" fill="' + c + '" stroke="' + EDGE + '" stroke-width="' + sw + '" stroke-linejoin="round"/></svg>';
    }
    var d = kind.rescue ? 15 : 10, s2 = kind.rescue ? 2.2 : 1;
    return '<svg class="ais-s" width="' + d + '" height="' + d + '" viewBox="0 0 ' + d + ' ' + d + '" aria-hidden="true">' +
      '<circle cx="' + d / 2 + '" cy="' + d / 2 + '" r="' + (d / 2 - s2 / 2) + '" fill="' + c + '" stroke="' + EDGE + '" stroke-width="' + s2 + '"/></svg>';
  }

  // Merkin ympärillä on läpinäkyvä napautusalue, jotta pieni ympyrä on helppo osua myös sormella.
  function build(c, label, hit) {
    var k = c.kind, half = halfOf(k);
    var html = '<div class="ais-w" data-mmsi="' + c.k + '" data-moving="' + (k.moving ? 1 : 0) + '" data-rescue="' + (k.rescue ? 1 : 0) +
      '" data-shape="' + (k.arrow ? 'nuoli' : 'ympyra') + '"' + (c.dim ? ' style="opacity:' + DIM_OPACITY + '"' : '') + '>' + shapeSvg(k) +
      (label ? '<span class="ais-n' + (k.rescue ? ' sar' : '') + '" style="left:' + Math.round(hit / 2 + half + 3) + 'px">' + UI.esc(label) + '</span>' : '') + '</div>';
    return { html: html, size: hit, zio: c.k === pinned ? 2000 : k.rescue ? 1000 : k.moving ? 300 : 0 };
  }
  function mkIcon(b) {
    return L.divIcon({ className: 'ais-ico', html: b.html, iconSize: [b.size, b.size], iconAnchor: [b.size / 2, b.size / 2], popupAnchor: [0, -Math.round(b.size / 2) + 2] });
  }

  function clearAll() {
    if (layer) layer.clearLayers();
    drawn = {};
  }
  function removeShip(k) {
    var d = drawn[k];
    if (!d) return;
    layer.removeLayer(d.m);
    if (d.vec) layer.removeLayer(d.vec);
    delete drawn[k];
  }

  function renderSoon() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 40); }

  function render() {
    if (!map || !layer) return;
    var z = map.getZoom();
    if (!enabled() || z < MIN_Z) { clearAll(); return; }
    var now = Date.now(), view = map.getBounds().pad(0.1), ctr = map.getCenter();
    var cands = [];
    Object.keys(pos).forEach(function (k) {
      var p = pos[k], age = now - p.t;
      if (age > MAX_AGE_MS) return;
      if (k !== pinned && !view.contains([p.lat, p.lng])) return;
      var v = ves[k], kind = kindOf(p, v);
      var dl = p.lat - ctr.lat, dn = p.lng - ctr.lng;
      cands.push({ k: k, p: p, v: v, kind: kind, dim: age > DIM_MS, rank: k === pinned ? -1 : kind.rescue ? 0 : kind.moving ? 1 : 2, d2: dl * dl + dn * dn });
    });
    // enintään 400 alusta: pelastusalukset ja liikkuvat alukset ovat etusijalla
    cands.sort(function (a, b) { return a.rank - b.rank || a.d2 - b.d2; });
    if (cands.length > MAX_DRAWN) cands.length = MAX_DRAWN;

    var hit = UI.isTouch() ? 38 : 26;
    // nimet: etusijajärjestyksessä, ja nimi joka osuisi jo sijoitetun nimen päälle jätetään pois
    var placed = [], labels = {}, wanted = 0;
    cands.forEach(function (c) {
      if (!(z >= LABEL_Z || (c.kind.rescue && z >= LABEL_Z_SAR))) return;
      if (!c.v || !c.v.name) {
        if (wanted < 8 && !noVes[c.k]) { wanted++; needVessel(c.k).then(function (v) { if (v) renderSoon(); }); }
        return;
      }
      var pt = map.latLngToContainerPoint([c.p.lat, c.p.lng]);
      var half = halfOf(c.kind);
      var x0 = pt.x + half + 3, r = { x0: x0, x1: x0 + c.v.name.length * 7.2 + 4, y0: pt.y - 8, y1: pt.y + 8 };
      for (var i = 0; i < placed.length; i++) {
        var o = placed[i];
        if (r.x0 < o.x1 && r.x1 > o.x0 && r.y0 < o.y1 && r.y1 > o.y0) return;
      }
      placed.push(r);
      labels[c.k] = c.v.name;
    });

    var mpp = 40075016.686 * Math.cos(ctr.lat * Math.PI / 180) / Math.pow(2, z + 8);   // metriä pikseliä kohden
    var seen = {};
    cands.forEach(function (c) {
      var k = c.k, b = build(c, labels[k], hit), d = drawn[k], ll = [c.p.lat, c.p.lng];
      seen[k] = true;
      if (!d) {
        d = drawn[k] = { m: L.marker(ll, { icon: mkIcon(b), pane: 'aisPane', keyboard: false, zIndexOffset: b.zio }), html: b.html, size: b.size, zio: b.zio, lat: c.p.lat, lng: c.p.lng, vec: null, vk: '' };
        bindCard(d.m, k);
        d.m.addTo(layer);
      } else {
        if (d.html !== b.html || d.size !== b.size) { d.m.setIcon(mkIcon(b)); d.html = b.html; d.size = b.size; }
        if (d.zio !== b.zio) { d.m.setZIndexOffset(b.zio); d.zio = b.zio; }
        if (d.lat !== c.p.lat || d.lng !== c.p.lng) { d.m.setLatLng(ll); d.lat = c.p.lat; d.lng = c.p.lng; }
      }
      // ECDISin tapainen nopeusvektori: kuuden minuutin matka kulkusuuntaan, aluksen värillä
      var dist = c.kind.moving && c.kind.vdir != null ? c.p.sog * VECTOR_MIN * G.NM : 0;
      if (dist / mpp >= 4) {
        var end = G.destination({ lat: c.p.lat, lng: c.p.lng }, c.kind.vdir, dist);
        var vk = [c.p.lat, c.p.lng, end.lat.toFixed(6), end.lng.toFixed(6), c.kind.color, c.dim ? 1 : 0, c.kind.rescue ? 1 : 0].join(',');
        if (!d.vec) {
          d.vec = L.polyline([ll, [end.lat, end.lng]], { pane: 'aisPane', interactive: false, className: 'ais-vec', color: c.kind.color, weight: c.kind.rescue ? 2 : 1.5, opacity: c.dim ? DIM_OPACITY : 0.9, lineCap: 'butt' }).addTo(layer);
          d.vk = vk;
        } else if (d.vk !== vk) {
          d.vec.setLatLngs([ll, [end.lat, end.lng]]);
          d.vec.setStyle({ color: c.kind.color, weight: c.kind.rescue ? 2 : 1.5, opacity: c.dim ? DIM_OPACITY : 0.9 });
          d.vk = vk;
        }
      } else if (d.vec) { layer.removeLayer(d.vec); d.vec = null; d.vk = ''; }
    });
    Object.keys(drawn).forEach(function (k) { if (!seen[k]) removeShip(k); });
    refreshPopup();
  }

  // ---------- aluksen kortti ----------
  function row(label, val) { return val == null || val === '' ? '' : '<tr><th>' + label + '</th><td>' + UI.esc(val) + '</td></tr>'; }
  function card(k) {
    var p = pos[k];
    if (!p) return '<div class="pop ais-pop"><b>Alus</b><div class="muted">Aluksen sijaintia ei enää ole tiedossa.</div></div>';
    var v = ves[k], len = v ? v.a + v.b : 0, wid = v ? v.c + v.d : 0;
    var size = len && wid ? len + ' × ' + wid + ' m' : len ? len + ' m' : wid ? wid + ' m' : '';
    var sizeLabel = len && wid ? 'Pituus × leveys' : len ? 'Pituus' : 'Leveys';
    var sub = v ? cap(typeName(v.shipType)) : (noVes[k] || singleFail[k] ? 'Alustietoja ei ole saatavilla' : 'Alustietoja haetaan…');
    var rows = row('MMSI', k) + (v ? row('IMO', v.imo || '') + row('Kutsutunnus', v.callSign) : '') +
      row('Tila', p.navStat != null ? navName(p.navStat) : '') +
      row('Nopeus', p.sog != null ? G.fmtNum(p.sog, 1) + ' kn' : '') +
      row('Kulku', p.cog != null ? G.fmtBrg(p.cog, 0) : '') +
      row('Keula', p.heading != null ? G.fmtBrg(p.heading, 0) : '') +
      (v ? row('Määränpää', v.destination) + row('ETA', fmtEta(v.eta)) + row('Syväys', v.draught ? G.fmtNum(v.draught / 10, 1) + ' m' : '') + row(sizeLabel, size) : '') +
      row('Sijainti', G.fmtPos(p)) + row('Sijainnin ikä', fmtAge(Date.now() - p.t));
    return '<div class="pop ais-pop"><b class="ais-t">' + UI.esc(v && v.name ? v.name : 'Alus ' + k) + '</b><div class="ais-sub">' + UI.esc(sub) + '</div>' +
      '<div class="ais-rows"><table>' + rows + '</table></div>' +
      '<button type="button" class="ais-task" data-mmsi="' + UI.esc(k) + '">Uusi tehtävä aluksen kohdalle</button>' +
      '<div class="pop-src">AIS: Fintraffic / Digitraffic, CC BY 4.0. Tieto on viiveellistä, eikä se sovellu navigointiin.</div></div>';
  }
  // Avoimen kortin sisältö päivitetään paikallaan, jottei painike vaihdu kesken napautuksen eikä kartta hypähdä.
  function refreshPopup() {
    var d = openMmsi && drawn[openMmsi];
    if (!d || !d.m.isPopupOpen()) return;
    var el = d.m.getPopup().getElement();
    if (!el) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = card(openMmsi);
    ['.ais-t', '.ais-sub', '.ais-rows'].forEach(function (sel) {
      var a = el.querySelector(sel), b = tmp.querySelector(sel);
      if (a && b && a.innerHTML !== b.innerHTML) a.innerHTML = b.innerHTML;
    });
  }
  function newTask(k) {
    var p = pos[k];
    if (!p) return;
    map.closePopup();
    global.Tools.editTask(null, { lat: p.lat, lng: p.lng });
  }
  function onCardClick(e) {
    var b = e.target && e.target.closest ? e.target.closest('.ais-task') : null;
    if (b) newTask(b.getAttribute('data-mmsi'));
  }
  function bindCard(m, k) {
    m.bindPopup(function () { return card(k); }, {
      className: 'ais-popup', minWidth: 230, maxWidth: 280, autoPanPaddingTopLeft: [72, 70], autoPanPaddingBottomRight: [16, 56]
    });
    m.on('popupopen', function (e) {
      openMmsi = k; pinned = k;
      var el = e.popup.getElement();
      if (el && !el._aisBound) { el._aisBound = true; el.addEventListener('click', onCardClick); }
      if (!ves[k] && !noVes[k]) needVessel(k).then(function () { if (openMmsi === k) { refreshPopup(); renderSoon(); } });
    });
    m.on('popupclose', function () { if (openMmsi === k) { openMmsi = null; pinned = null; } });
  }

  // Avaa aluksen kortin. Kerros kytketään tarvittaessa päälle. Kortti avataan hetken kuluttua, kun kartan siirtymä on päättynyt.
  function open(mmsi) {
    mmsi = String(mmsi);
    var sh = S.state.settings.show;
    if (sh.ais === false) { sh.ais = true; S.save(); }
    pinned = mmsi; pendingOpen = mmsi;
    sync();
    clearTimeout(openTimer);
    openTimer = setTimeout(function () {
      var k = pendingOpen; pendingOpen = null;
      if (!k) return;
      render();
      if (drawn[k]) drawn[k].m.openPopup(); else if (pinned === k) pinned = null;
    }, 350);
  }

  // ---------- haku ----------
  // Haku toimii myös silloin, kun kerros on pois päältä: tieto haetaan kerran ja jaetaan samanaikaisten hakujen kesken.
  function ensureData() {
    var jobs = [];
    if (!posOkAt || Date.now() - posOkAt > FRESH_MS) jobs.push(loadPositions(true));
    if (!vesLoaded) jobs.push(loadVessels(true));
    return Promise.all(jobs);
  }
  function within(ms, promise, fallback) {
    return new Promise(function (resolve) {
      var done = false, to = setTimeout(function () { if (!done) { done = true; resolve(fallback); } }, ms);
      var fin = function (v) { if (!done) { done = true; clearTimeout(to); resolve(v); } };
      promise.then(fin, function () { fin(fallback); });
    });
  }
  function shipInfo(p, v) {
    var t = v ? v.shipType : null;
    return 'AIS-alus' + (t != null && typeName(t) !== 'tuntematon' ? ', ' + typeName(t) : '') +
      (p.sog != null ? (p.sog >= MOVING_KN ? ', ' + G.fmtNum(p.sog, 1) + ' kn' : ', paikallaan') : '');
  }
  // Palauttaa lupauksen lähimmistä (enintään 10) hakua vastaavista aluksista. Mukaan otetaan vain ajantasaisen sijainnin alukset.
  function search(q, at) {
    q = String(q || '').trim();
    if (q.length < 2) return Promise.resolve([]);
    var nq = fold(q), nsp = nq.replace(/\s+/g, ''), digits = /^\d{3,}$/.test(q) ? q : null;
    var from = at || map.getCenter();
    return within(8000, ensureData().then(function () {
      var now = Date.now(), hits = [];
      Object.keys(pos).forEach(function (k) {
        var p = pos[k];
        if (now - p.t > MAX_AGE_MS) return;
        var v = ves[k];
        var hit = (v && v.nameKey && v.nameKey.indexOf(nq) >= 0) ||
          (v && v.callKey && v.callKey.indexOf(nsp) === 0) ||
          (digits && k.indexOf(digits) === 0);
        if (hit) hits.push({ k: k, d: G.distance(from, p) });
      });
      hits.sort(function (a, b) { return a.d - b.d; });
      hits = hits.slice(0, 10);
      // MMSI-numerolla löytyneen aluksen nimi haetaan erikseen, jos sitä ei ole bulkkiaineistossa
      return Promise.all(hits.map(function (h) { return needVessel(h.k); })).then(function () {
        return hits.map(function (h) {
          var p = pos[h.k], v = ves[h.k];
          return { name: v && v.name ? v.name : 'MMSI ' + h.k, info: shipInfo(p, v), lat: p.lat, lng: p.lng, ais: true, mmsi: h.k };
        });
      });
    }), []);
  }
  // Selitys, jos haku ei saanut tietoa Digitrafficista
  function searchNote() { return failStreak > 0 && (!posOkAt || Date.now() - posOkAt > FRESH_MS) ? 'AIS-tietoa ei saatu Digitrafficista, joten alukset eivät ole mukana hakutuloksissa.' : ''; }

  // ---------- käynnistys ----------
  function init(m) {
    map = m;
    map.createPane('aisPane');
    map.getPane('aisPane').style.zIndex = PANE_Z;
    layer = L.layerGroup().addTo(map);
    var notes = map.getContainer().querySelector('.map-notes');
    if (notes) {
      noteEl = L.DomUtil.create('div', 'enc-note ais-note', notes);
      noteEl.textContent = 'AIS-tietoa ei saatu. Kartan alukset voivat olla vanhentuneita.';
      noteEl.hidden = true;
    }
    map.on('moveend zoomend', renderSoon);
    document.addEventListener('visibilitychange', sync);
    sync();
  }

  global.Ais = {
    init: init, sync: sync, search: search, searchNote: searchNote, open: open,
    typeName: typeName, MIN_ZOOM: MIN_Z,
    get running() { return running; },
    get count() { return Object.keys(pos).length; },
    get drawnCount() { return Object.keys(drawn).length; }
  };
})(window);

</script>
<script>
/* Reittikartta – paikkahaku: koordinaatit, omat kohteet, Väyläviraston turvalaitteet nimellä ja
 * numerolla, väylät, sulut ja avattavat sillat, Traficomin luotsipaikat ja VTS-ilmoittautumispisteet
 * sekä (API-avaimella tai välityspalvelulla) Maanmittauslaitoksen nimistörekisteri. Lisäksi haetaan
 * AIS-alukset nimen osalla, kutsutunnuksella ja MMSI-numeron alulla (ais.js).
 * Haku ei lue nimiä karttakuvasta, joten se toimii samoin kaikilla karttapohjilla.
 *
 * Suomessa on paljon samannimisiä paikkoja (esim. kymmeniä Viitasaaria), joten tulokset
 * järjestetään etäisyyden mukaan hakuhetken kartan keskipisteestä ja näytetään kartalla
 * numeroituina. Alle 50 km:n päässä olevat (sama vesialue) tulevat ensin. */
(function (global) {
  'use strict';

  var UI = global.UI, G = global.Geo, S = global.Store;
  var VAYLA = 'https://avoinapi.vaylapilvi.fi/vaylatiedot/ows?SERVICE=WFS&VERSION=1.0.0&REQUEST=GetFeature' +
    '&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&MAXFEATURES=40';
  var NEAR_KM = 50;
  var map, input, box, seq = 0, timer = null, results = [], sel = -1, hlLayer = null, resLayer = null;
  var ref = null;            // hakupiste: kartan keskipiste, kun haku aloitettiin
  var fittedFor = null;

  function norm(s) { return String(s || '').toLowerCase(); }
  function local(q) {
    var n = norm(q), out = [], st = S.state;
    st.marks.forEach(function (m) { if (norm(m.name).indexOf(n) >= 0) out.push({ name: m.name, info: 'oma merkki', lat: m.lat, lng: m.lng }); });
    st.tasks.forEach(function (t) { if (t.lat != null && norm(t.name).indexOf(n) >= 0) out.push({ name: t.name, info: 'tehtäväpaikka', lat: t.lat, lng: t.lng }); });
    st.routes.forEach(function (r) {
      if (r.points.length && norm(r.name).indexOf(n) >= 0) out.push({ name: r.name || 'Nimetön reitti', info: 'reitti', lat: r.points[0].lat, lng: r.points[0].lng, route: r.id });
    });
    var s0 = st.settings.station;
    if (s0 && norm(s0.name || 'asema').indexOf(n) >= 0) out.push({ name: s0.name || 'Asema', info: 'asema', lat: s0.lat, lng: s0.lng });
    return out;
  }
  function wfs(layer, cql) {
    return fetch(VAYLA + '&TYPENAME=' + layer + '&CQL_FILTER=' + encodeURIComponent(cql))
      .then(function (r) { return r.ok ? r.json() : { features: [] }; })
      .then(function (j) { return j.features || []; }, function () { return []; });
  }
  function esc(q) { return q.replace(/'/g, "''"); }
  // geometrian edustava piste: piste sellaisenaan, viivalta keskimmäinen piste, alueelta reunan keskiarvo
  function repPoint(g) {
    if (!g) return null;
    var c = g.coordinates;
    if (g.type === 'Point') return c;
    if (g.type === 'MultiPoint') return c[0];
    if (g.type === 'LineString') return c[Math.floor(c.length / 2)];
    if (g.type === 'MultiLineString') { var all = [].concat.apply([], c); return all[Math.floor(all.length / 2)]; }
    var ring = g.type === 'Polygon' ? c[0] : g.type === 'MultiPolygon' ? c[0][0] : null;
    if (!ring || !ring.length) return null;
    var sx = 0, sy = 0; ring.forEach(function (p) { sx += p[0]; sy += p[1]; });
    return [sx / ring.length, sy / ring.length];
  }
  function lineOf(g) {
    if (!g) return null;
    if (g.type === 'LineString') return g.coordinates.map(function (p) { return [p[1], p[0]]; });
    if (g.type === 'MultiLineString') return g.coordinates.map(function (c) { return c.map(function (p) { return [p[1], p[0]]; }); });
    return null;
  }
  // Väyläviraston turvalaitteet nimellä; pelkkä numero hakee turvalaitenumerolla (alusta)
  function aids(q) {
    var num = /^\d{2,}$/.test(q);
    var cql = num ? "turvalaitenumero LIKE '" + esc(q) + "%'" : "nimifi ILIKE '%" + esc(q) + "%'";
    var layers = ['vesivaylatiedot:turvalaitteet_uusi', 'vesivaylatiedot:turvalaitteet_muut_vaylanpitajat'];
    return Promise.all(layers.map(function (l) { return wfs(l, cql); })).then(function (lists) {
      var out = [];
      lists.forEach(function (fs) {
        fs.forEach(function (f) {
          var c = repPoint(f.geometry), p = f.properties || {};
          if (!c) return;
          out.push({ name: p.nimifi || 'Turvalaite', info: 'turvalaite, ' + (p.turvalaitetyyppifi || '').toLowerCase() + (p.turvalaitenumero ? ' ' + p.turvalaitenumero : ''), lat: c[1], lng: c[0], aid: true });
        });
      });
      return out;
    });
  }
  // Väyläviraston väylät nimellä: osuma osoittaa väylän keskikohtaan, ja valinta korostaa koko väylän
  function fairways(q) {
    if (/^\d+$/.test(q)) return Promise.resolve([]);
    return wfs('vesivaylatiedot:vaylat_uusi', "nimifi ILIKE '%" + esc(q) + "%'").then(function (fs) {
      var out = [];
      fs.forEach(function (f) {
        var c = repPoint(f.geometry), p = f.properties || {};
        if (!c) return;
        out.push({ name: p.nimifi || 'Väylä', info: 'väylä' + (p.vaylaluokkafi ? ', ' + p.vaylaluokkafi : '') + (p.mitoitussyvays != null ? ', ' + G.fmtNum(Number(p.mitoitussyvays), 1) + ' m' : ''), lat: c[1], lng: c[0], line: lineOf(f.geometry) });
      });
      return out;
    });
  }
  // sulut, kanavat ja avattavat sillat
  function canals(q) {
    if (/^\d+$/.test(q)) return Promise.resolve([]);
    return wfs('vesivaylatiedot:sulkukanavat_uusi', "nimi ILIKE '%" + esc(q) + "%'").then(function (fs) {
      var out = [];
      fs.forEach(function (f) {
        var c = repPoint(f.geometry), p = f.properties || {};
        if (!c) return;
        var kind = (p.kanavaaluetyyppi || 'kanava').toLowerCase();
        out.push({ name: p.nimi || 'Kanava', info: kind + (p.vesisto ? ', ' + p.vesisto : '') + (p.alussyvyys != null ? ', syväys ' + G.fmtNum(Number(p.alussyvyys), 1) + ' m' : ''), lat: c[1], lng: c[0] });
      });
      return out;
    });
  }
  // Traficomin luotsipaikat ja VTS-ilmoittautumispisteet: palvelu ei vastaa selaimen suodatettuihin
  // kyselyihin, joten koko pieni aineisto (noin sata pistettä) haetaan kerran ja suodatetaan täällä.
  var TRAFICOM = 'https://julkinen.traficom.fi/inspirepalvelu/avoin/wfs?SERVICE=WFS&VERSION=1.0.0&REQUEST=GetFeature&OUTPUTFORMAT=application/json&SRSNAME=EPSG:4326&TYPENAME=';
  var traficomCache = null;
  function traficomPoints() {
    if (traficomCache) return traficomCache;
    var layers = [['avoin:PilotBoardingPlace_P', 'luotsipaikka'], ['avoin:Rdocal_P', 'VTS-ilmoittautumispiste']];
    traficomCache = Promise.all(layers.map(function (l) {
      return fetch(TRAFICOM + l[0]).then(function (r) { return r.ok ? r.json() : { features: [] }; }).then(function (j) {
        return (j.features || []).map(function (f) {
          var c = repPoint(f.geometry), p = f.properties || {};
          if (!c || !p.OBJNAM) return null;
          return { name: p.OBJNAM, info: l[1] + (p.INFORM ? ', ' + p.INFORM : ''), lat: c[1], lng: c[0] };
        }).filter(Boolean);
      }, function () { return []; });
    })).then(function (lists) { return lists[0].concat(lists[1]); });
    traficomCache.then(function (all) { if (!all.length) traficomCache = null; });   // yritetään uudelleen seuraavalla haulla
    return traficomCache;
  }
  function traficom(q) {
    if (/^\d+$/.test(q)) return Promise.resolve([]);
    var n = norm(q);
    return traficomPoints().then(function (all) { return all.filter(function (it) { return norm(it.name).indexOf(n) >= 0; }); });
  }

  // etäisyys ja suunta hakupisteestä
  function place(items, at) {
    at = at || ref;
    items.forEach(function (it) {
      it.km = G.distance(at, it) / 1000;
      it.brg = G.bearing(at, it);
    });
    return items.sort(function (a, b) { return a.km - b.km; });
  }
  function hasNames() { return !!(global.ChartAPI && global.ChartAPI.searchNames && global.ChartAPI.mmlInfo.available); }
  // syy, miksi paikannimiä ei tullut (avain puuttuu, palvelin ei vastaa), tai tyhjä
  function namesNote() { return global.ChartAPI && global.ChartAPI.namesNote ? global.ChartAPI.namesNote() : ''; }
  // turvalaitteet ja paikannimet, etäisyysjärjestyksessä pisteestä at
  function remote(q, at) {
    return Promise.all([
      aids(q), fairways(q), canals(q), traficom(q),
      hasNames() ? global.ChartAPI.searchNames(q, at).catch(function () { return []; }) : Promise.resolve([])
    ]).then(function (res) {
      return place(res[4].concat(res[0], res[1], res[2], res[3]), at);
    });
  }
  // AIS-alukset nimen osalla, kutsutunnuksella tai MMSI-numerolla. Lupaus ei hylkäydy: virhe antaa tyhjän listan.
  function ships(q, at) {
    if (!global.Ais) return Promise.resolve([]);
    return global.Ais.search(q, at || ref).then(function (list) { return list; }, function () { return []; });
  }
  // Haku muille toiminnoille (tehtäväpaikka): koordinaatti, omat kohteet, AIS-alukset, turvalaitteet ja paikannimet
  // yhtenä listana lähimmästä kauimpaan. Palauttaa lupauksen.
  function find(q, at) {
    q = String(q || '').trim();
    if (q.length < 2) return Promise.resolve([]);
    var p = G.parsePos(q);
    if (p) return Promise.resolve(place([{ name: G.fmtPos(p), info: 'koordinaatti', lat: p.lat, lng: p.lng, coord: true }], at));
    var mine = local(q);
